name: selftest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the translated-README lag check counts commits since each translation's base
      # No bubblewrap on Linux: the bwrap checks in selftest.sh do not pass yet, so the build sandbox check is skipped there
      - name: Tools
        run: |
          /bin/bash --version | head -1
          bash --version | head -1
          command -v sandbox-exec bwrap jq git || true
      - name: bash -n
        run: for f in scripts/*.sh; do /bin/bash -n "$f"; done
      - name: selftest (macOS, /bin/bash 3.2)
        if: runner.os == 'macOS'
        # /bin first so the scripts' #!/usr/bin/env bash also picks 3.2 over Homebrew's bash
        run: PATH="/bin:$PATH" /bin/bash scripts/selftest.sh
      - name: selftest (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/selftest.sh
